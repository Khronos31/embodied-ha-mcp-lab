name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MCP Lab
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read pinned EHA source identity
        id: packaging
        run: python3 scripts/verify_mcp_lab_packaging.py --github-output "$GITHUB_OUTPUT"

      - name: Check out pinned EHA source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.packaging.outputs.tested_eha_repository }}
          ref: ${{ steps.packaging.outputs.tested_eha_revision }}
          path: .upstream/embodied-ha-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a3d9c617fc835455c6e68e7f14d049dad37a515f # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify
        run: |
          ruff check .
          pytest -q
          python3 scripts/verify_mcp_lab_packaging.py \
            --upstream-root .upstream/embodied-ha-repo/embodied_ha
