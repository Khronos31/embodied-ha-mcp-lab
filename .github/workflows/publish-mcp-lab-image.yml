name: Publish MCP Lab image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Lab version; dispatch on tag mcp-lab-v<version>"
        required: true
        type: string

concurrency:
  group: publish-mcp-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify tag and packaging contract
        id: packaging
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_REF_TYPE" = "tag"
          python3 scripts/verify_mcp_lab_packaging.py \
            --release-ref "$RELEASE_REF" \
            --requested-version "$REQUESTED_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested candidate exactly once
        env:
          CANDIDATE: ghcr.io/khronos31/embodied-ha-mcp-lab:candidate-${{ github.sha }}
          RELEASE: ghcr.io/khronos31/embodied-ha-mcp-lab:${{ steps.packaging.outputs.lab_version }}
        run: |
          docker buildx imagetools inspect "$CANDIDATE" >/dev/null
          if docker buildx imagetools inspect "$RELEASE" >/dev/null 2>&1; then
            echo "::error::Release tag already exists and is immutable: $RELEASE"
            exit 1
          fi
          docker buildx imagetools create --tag "$RELEASE" "$CANDIDATE"
          digest=$(docker buildx imagetools inspect "$RELEASE" --format '{{json .Manifest.Digest}}')
          test -n "$digest"
          echo "Release digest $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the first-publication gate
        run: |
          echo "::notice::Before HAOS installation, make the GHCR package public and verify an anonymous pull of this exact version."
