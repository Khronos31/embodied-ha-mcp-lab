name: Embodied HA MCP Lab
version: "0.1.1"
slug: embodied_ha_mcp_lab
description: "Developer lab for exercising Embodied HA MCP tools and recording edge cases."
advanced: true
stage: experimental
arch:
  - amd64
  - aarch64
# CIが同じembodied_ha/ source contextから生成するLab専用multi-arch image。
image: "ghcr.io/khronos31/embodied-ha-mcp-lab"
init: true
startup: application
boot: manual
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:flask-outline
# The Lab intentionally exercises real EHA capabilities. Its dedicated configuration,
# state repository, and evidence live below /config/embodied-ha-mcp-lab on the host.
map:
  - type: homeassistant_config
    read_only: false
    path: /config
audio: true
homeassistant_api: true
services:
  - mqtt:want
options:
  tested_harness: claude
  timeout_seconds: 45
schema:
  tested_harness: list(claude|codex|agy)
  timeout_seconds: int(1,300)
